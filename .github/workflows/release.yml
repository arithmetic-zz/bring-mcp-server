name: Release binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.system }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            system: linux
            arch: x86_64
            extension: tar.gz
          - runner: windows-2022
            system: windows
            arch: x86_64
            extension: zip
          - runner: macos-15
            system: macos
            arch: arm64
            extension: tar.gz
          - runner: macos-15-intel
            system: macos
            arch: x86_64
            extension: tar.gz
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Test source and dependency consistency
        run: |
          python -m unittest discover -s tests -v
          python -m pip check
      - name: Build standalone executable
        run: python -m PyInstaller --noconfirm --clean bring-mcp-server.spec
      - name: Package executable and licenses
        env:
          SYSTEM: ${{ matrix.system }}
          ARCH: ${{ matrix.arch }}
          BINARY: dist/bring-mcp-server${{ matrix.system == 'windows' && '.exe' || '' }}
        run: python scripts/package_release.py --binary "$BINARY" --version "$RELEASE_TAG" --system "$SYSTEM" --arch "$ARCH"
      - name: Test the extracted release archive over MCP stdio
        env:
          SYSTEM: ${{ matrix.system }}
          ARCH: ${{ matrix.arch }}
          EXTENSION: ${{ matrix.extension }}
        run: python scripts/smoke_test.py --archive "dist/release/bring-mcp-server-${RELEASE_TAG}-${SYSTEM}-${ARCH}.${EXTENSION}"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: binary-${{ matrix.system }}-${{ matrix.arch }}
          path: dist/release/*
          if-no-files-found: error

  publish:
    name: Publish tested downloads
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: binary-*
          merge-multiple: true
          path: artifacts
      - name: Assemble checksums
        run: cat artifacts/*.sha256 > artifacts/SHA256SUMS
      - name: Create draft, upload assets, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --generate-notes --draft
          gh release upload "$RELEASE_TAG" artifacts/*.zip artifacts/*.tar.gz artifacts/SHA256SUMS
          gh release edit "$RELEASE_TAG" --draft=false --latest
